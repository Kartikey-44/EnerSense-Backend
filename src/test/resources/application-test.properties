# Tests run against in-memory H2 in PostgreSQL mode. Flyway is off and Hibernate builds
# the schema, so a test never depends on a running database.
spring.datasource.url=jdbc:h2:mem:enersense;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Tests build their own fixtures; the bundled CSV must not load.
enersense.data.csv=classpath:data/test-readings.csv
enersense.data.consumer-id=TEST01
enersense.data.consumer-name=Test Consumer
enersense.data.meter-id=TESTMTR

enersense.forecast.strategy=PERSISTENCE
enersense.forecast.window-days=7
enersense.forecast.ewma-alpha=0.5

enersense.anomaly.min-baseline-days=3
enersense.anomaly.max-baseline-days=14
enersense.anomaly.z-multiplier=2.5
enersense.anomaly.min-delta-wh=100
