spring.application.name=enersense

# Credentials come from the environment. Nothing is committed.
# DB_URL has a sensible local default; username and password must be supplied.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/enersense}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway creates and owns the schema; Hibernate only checks that the entities match it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=8080
server.error.include-message=never

# Which series the loader imports on first run, and the identity it is filed under.
enersense.data.csv=classpath:data/readings.csv
enersense.data.consumer-id=APT35
enersense.data.consumer-name=Demo Apartment 35
enersense.data.meter-id=MTR35

# Forecasting. strategy: PERSISTENCE | MOVING_AVERAGE | EWMA
# PERSISTENCE is the default because it measured best on this data; see docs/FORECASTING.md
enersense.forecast.strategy=EWMA
enersense.forecast.window-days=7
enersense.forecast.ewma-alpha=0.5

# Anomaly detection thresholds.
enersense.anomaly.min-baseline-days=3
enersense.anomaly.max-baseline-days=14
enersense.anomaly.z-multiplier=2.5
enersense.anomaly.min-delta-wh=100
